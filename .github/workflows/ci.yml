name: CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # Build-time placeholders only — real secrets live on Vercel Preview/Production
          NEXT_PUBLIC_APP_URL: https://dev.nodoseoff.com
          NEXT_PUBLIC_NEON_AUTH_URL: https://example.invalid/auth
          NEON_AUTH_BASE_URL: https://example.invalid/auth
          NEON_AUTH_COOKIE_SECRET: ci-build-placeholder-secret-not-for-prod
          NEON_AUTH_JWKS_URL: https://example.invalid/auth/.well-known/jwks.json
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?sslmode=disable
          AUTH_TRUSTED_ORIGINS: https://dev.nodoseoff.com,https://nodoseoff.com
