name: CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # Build-time public placeholders — real secrets live on Vercel
          NEXT_PUBLIC_APP_URL: https://dev.nodoseoff.com
          NEXT_PUBLIC_NEON_AUTH_URL: https://example.invalid/auth
